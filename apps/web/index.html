<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/src/assets/clinmesh-mark.webp" />
    <meta name="description" content="科灵脉智医疗智能体平台" />
    <title>Clinmesh | 科灵脉智医疗智能体平台</title>
    <script>
      (() => {
        const appearanceKey = 'clinmesh.appearance:v2'
        const legacyKey = 'clinmesh.preferences:v1'
        const root = document.documentElement
        root.dataset.clinmeshApp = 'web'
        let locale = 'zh-CN'
        let colorMode = 'system'
        let density = 'default'
        let themeId = 'default'

        try {
          const legacyStored = localStorage.getItem(legacyKey)
          const legacy = legacyStored === null ? null : JSON.parse(legacyStored)
          if (legacy?.locale === 'zh-CN' || legacy?.locale === 'en-US') locale = legacy.locale
          if (legacy?.theme === 'system' || legacy?.theme === 'light' || legacy?.theme === 'dark') {
            colorMode = legacy.theme
          }
          const storedV2 = localStorage.getItem(appearanceKey)
          const v2 = storedV2 === null ? null : JSON.parse(storedV2)
          if (v2?.version === 2) {
            if (v2.colorMode === 'system' || v2.colorMode === 'light' || v2.colorMode === 'dark') {
              colorMode = v2.colorMode
            }
            if (typeof v2.theme === 'string' && v2.theme.length > 0) themeId = v2.theme
            if (v2.density === 'compact' || v2.density === 'default' || v2.density === 'comfortable') {
              density = v2.density
            }
          }
          const params = new URLSearchParams(location.search)
          if (params.get('theme') === 'default') {
            sessionStorage.setItem('clinmesh.themeSafeMode', '1')
            themeId = 'default'
          } else if (sessionStorage.getItem('clinmesh.themeSafeMode') === '1') {
            themeId = 'default'
          }
        } catch {
          // Browser storage is optional; defaults remain deterministic.
        }

        const resolvedMode = colorMode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : colorMode
        root.lang = locale
        root.classList.toggle('dark', resolvedMode === 'dark')
        root.classList.toggle('theme-dark', resolvedMode === 'dark')
        root.classList.toggle('theme-light', resolvedMode !== 'dark')
        root.dataset.theme = themeId
        root.dataset.colorMode = resolvedMode
        root.dataset.density = density
        root.style.colorScheme = resolvedMode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
