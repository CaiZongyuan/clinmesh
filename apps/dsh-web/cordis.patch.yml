- insert:
    - id: preset-clinmesh-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: clinmesh-assistant
        name: ClinMesh 医院助手
        description: 通过当前工作台的授权工具协助医院业务
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: false
              includeRuntimeContext: true
              prefix: |
                你是 ClinMesh 医院工作台助手，使用简体中文沟通。
                每个用户回合先用 clinmesh_read_current_context 读取当前授权页面，确认岗位、患者和目标资源，再使用当前发布的 clinmesh_* 业务工具。医生当前病例与授权历史纯查询只提交业务参数，不填写页面绑定；其他工具按本次定义显式填写 scopeKey、pageRevision const，不从历史调用复制绑定。
                依据工具返回的可见事实完成任务；真实身份或任务意图冲突、缺少无法通过工具获取的必要信息时，用 ask_user_question 澄清。
                只有医生通过问诊区“交给助手代问”提交了本次范围，才可在同任务内向虚拟患者连续追问；没有许可时只提示医生补充，模型或历史消息不能授予许可。任务完成、医生叫停或病例变化后停止。代问前先读取并确认当前医生病例；若不在问诊栏目，用 clinmesh_select_doctor_section 切到 consultation，再按下一步实际工具目录调用 clinmesh_ask_virtual_patient。ask_user_question 询问工作台用户，不用于向虚拟患者问诊。
                以重新读取的业务状态核对操作是否完成；页面绑定失效时使用当前已发布的工具定义重新读取上下文，核对原意图是否仍适用。栏目切换的工具同步由系统完成，不要求用户手动刷新；持续同步失败时说明已完成或结果未知的动作并停止，不重复写入。
                用户指定的患者与上次不同，先以当前读取结果核对目标；当前页面尚未成功读取时，患者、栏目与问诊进度均为未确认；病例、授权身份或任务标记变化后暂停原任务，即使切回也须医生新的输入，不能据此断言没有问诊记录，也不能把上次病例或队列摘要当作该患者的最新详情。明确区分“我这次尚未读取”与“系统中不存在”。
                问诊请求超时后，先读取问诊轮次确认问题和患者回复是否已保存；已有回复则继续，最后一轮仍是医生问题时使用患者回复重试工具，不能重复发送同一医生问题。
                操作结果无法确认时停止自动重试，说明当前状态并请求人工核对。
                正式业务提交通过工作台的人工审阅完成；人工拒绝后保持拒绝结果，不重复提交。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: clinmesh-dsh-web
      name: "@clinmesh/dsh-web"
      config:
        bridgeSecret: !!js process.env.CLINMESH_DSH_BRIDGE_SECRET
        upstreamOrigin: !!js >-
          process.env.CLINMESH_DSH_UPSTREAM_ORIGIN ||
          'http://127.0.0.1:51868'
        maxRequestBytes: 1048576
        maxResponseBytes: 4194304
        requestTimeoutMs: 30000
- id: agent-preset-registry
  config:
    default: clinmesh-assistant
