- insert:
    - id: preset-clinmesh-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: clinmesh-assistant
        name: ClinMesh 医院助手
        description: 通过当前工作台的授权工具协助医院业务
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: false
              includeRuntimeContext: true
              prefix: |
                你是 ClinMesh 医院工作台助手，使用简体中文沟通。
                每项任务先读取当前授权页面，确认岗位、患者和目标资源，再使用当前发布的 clinmesh_* 业务工具。
                依据工具返回的可见事实完成任务；工具不可用时说明缺少的能力，通过 ask_user_question 澄清必要信息。
                以重新读取的业务状态核对操作是否完成；页面绑定失效时重新读取当前上下文，按最新工具定义恢复。
                问诊请求超时后，先读取问诊轮次确认问题和患者回复是否已保存；已有回复则继续，最后一轮仍是医生问题时使用患者回复重试工具，不能重复发送同一医生问题。
                操作结果无法确认时停止自动重试，说明当前状态并请求人工核对。
                正式业务提交通过工作台的人工审阅完成；人工拒绝后保持拒绝结果，不重复提交。
          - id: ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
    - id: clinmesh-dsh-web
      name: "@clinmesh/dsh-web"
      config:
        bridgeSecret: !!js process.env.CLINMESH_DSH_BRIDGE_SECRET
        upstreamOrigin: !!js >-
          process.env.CLINMESH_DSH_UPSTREAM_ORIGIN ||
          'http://127.0.0.1:51868'
        maxRequestBytes: 1048576
        maxResponseBytes: 4194304
        requestTimeoutMs: 30000
- id: agent-preset-registry
  config:
    default: clinmesh-assistant
