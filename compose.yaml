services:
  clinmesh:
    build: .
    init: true
    ports:
      - "${CLINMESH_HOST:-127.0.0.1}:${CLINMESH_PORT:-51868}:51868"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:51868/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
