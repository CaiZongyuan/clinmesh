name: Verify DSH candidate

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install candidate and run compatibility checks
        run: pnpm upstream:verify
        env:
          pnpm_config_verify_deps_before_run: error
      - name: Append verified dependency inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXPECTED_HEAD: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)
          test "$actual" = "$EXPECTED_HEAD" || { echo '分支已有人工提交，保留现场并重新运行验收'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-upstreams.lock.json deployment/dsh/automation.json deployment/dsh/host/package.json deployment/dsh/host/package-lock.json deployment/dsh/profile/package.json deployment/dsh/profile/pnpm-lock.yaml apps/dsh-web/package.json pnpm-lock.yaml vendor/dsh-react-surface
          if ! git diff --cached --quiet; then
            git commit -m 'chore(upstream): 固定通过自动验收的候选输入' -m $'背景：\n- 上游升级需要可重建的候选组合\n\n变更：\n- 追加精确依赖锁与源码引用，仍需人工验收及合并\n\n验证：\n- 临时 Profile、宿主 smoke 与 pnpm check 通过；耗时见 Actions 日志\n\n关联：\n- Refs #92'
            gh auth setup-git
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record exact commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ env.VERIFIED_HEAD || inputs.revision }}
          OUTCOME: ${{ job.status }}
        run: |
          state=failure
          description='待适配：候选安装或检查失败，查看运行证据'
          if [ "$OUTCOME" = success ]; then
            state=success
            description='自动检查通过；仍需原生会话人工验收与合并'
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$REVISION" --method POST -f state="$state" -f context='DSH candidate compatibility' -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility-${{ inputs.revision }}
          path: .upstream-evidence/
          include-hidden-files: true
