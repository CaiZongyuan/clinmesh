name: Synthea Provider image

on:
  pull_request:
    paths:
      - ".github/workflows/synthea-provider.yml"
      - "apps/synthea-provider/**"
      - "apps/server/src/infrastructure/scenario-generation/synthea-provider.ts"
      - "apps/server/tests/synthea-docker-contract.test.ts"
      - "apps/server/tests/synthea-generation-provider.test.ts"
  push:
    branches:
      - "issue-76-synthea-deployment"
    paths:
      - ".github/workflows/synthea-provider.yml"
      - "apps/synthea-provider/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/caizongyuan/clinmesh-synthea-provider
  LOCALIZER_IMAGE: ghcr.io/caizongyuan/cn-health-synthea-localizer@sha256:8b716811d6912b4502168bd23e2cf5f8c25b2f7dcc64caae6706eb1b45262448

jobs:
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: apps/synthea-provider
          file: apps/synthea-provider/Dockerfile
          load: true
          tags: clinmesh-synthea-provider:test
          cache-from: type=gha,scope=synthea-provider
          cache-to: type=gha,mode=max,scope=synthea-provider
      - name: Verify Provider and localizer together
        run: |
          set -euo pipefail
          network=clinmesh-synthea-provider-test
          docker network create "$network"
          docker run --rm --detach \
            --name cn-health-localizer \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "$LOCALIZER_IMAGE"
          docker run --rm --detach \
            --name synthea-provider \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:size=1g,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:51878:51878 \
            clinmesh-synthea-provider:test
          trap 'docker rm --force synthea-provider cn-health-localizer >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT
          curl --fail --retry 60 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:51878/health > /tmp/synthea-provider-health.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/synthea-provider-health.json').read_text())
          assert health['status'] == 'ok'
          assert health['syntheaCommit'] == 'd9d07a6eef91ee5144293b42ab64224d84d124f8'
          assert health['localization']['profileId'] == 'synthea-cn@2026-08-29.r4'
          PY
          docker exec synthea-provider \
            java -cp /opt/provider:/opt/synthea/synthea.jar ProviderServer --smoke

  publish-image:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: test-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/synthea-provider
          file: apps/synthea-provider/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=synthea-provider
          cache-to: type=gha,mode=max,scope=synthea-provider
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
