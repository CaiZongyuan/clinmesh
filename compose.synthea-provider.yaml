services:
  cn-health-localizer:
    build:
      context: ${CN_HEALTH_DATA_CONTEXT:-../cn-health-data}
      dockerfile: Dockerfile.synthea-localizer
    cap_drop:
      - ALL
    cpus: "1.0"
    environment:
      CN_HEALTH_GEOGRAPHY_RELEASE_PATH: /data/geography
      CN_HEALTH_NAMES_RELEASE_PATH: /data/names
      CN_HEALTH_POPULATION_RELEASE_PATH: /data/population
      CN_HEALTH_SYNTHEA_PROFILE_PATH: /data/profile
      CN_HEALTH_SYNTHEA_TRANSLATION_CATALOG_PATH: /data/translation/catalog.jsonl
      CN_HEALTH_SYNTHEA_CLINICAL_DISPLAY_PROJECTION_ID: synthea-zh-cn@2026-08-30.r1
    init: true
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: ${CN_HEALTH_DATA_RUN_AS:-1000:1000}
    volumes:
      - ${CN_HEALTH_DATA_DIST:-../cn-health-data/dist}/synthea-cn-profile/releases/2026-08-29.r3:/data/profile:ro
      - ${CN_HEALTH_DATA_DIST:-../cn-health-data/dist}/names-cn/releases/40.37.0.r1:/data/names:ro
      - ${CN_HEALTH_DATA_DIST:-../cn-health-data/dist}/geography-cn/releases/2026-08-29.r1:/data/geography:ro
      - ${CN_HEALTH_DATA_DIST:-../cn-health-data/dist}/population-cn/releases/WPP2024.r1:/data/population:ro
      - ${CN_HEALTH_DATA_CONTEXT:-../cn-health-data}/translations/synthea-zh-cn:/data/translation:ro

  synthea-provider:
    build:
      context: apps/synthea-provider
    cap_drop:
      - ALL
    cpus: "2.0"
    depends_on:
      cn-health-localizer:
        condition: service_healthy
    environment:
      CN_HEALTH_LOCALIZER_URL: http://cn-health-localizer:51879/v1/localize
      SYNTHEA_CLASSPATH_PATH: /opt/cn-health/synthea-profile/classpath
      SYNTHEA_CONFIG_PATH: /opt/cn-health/synthea-profile/synthea.properties
    init: true
    mem_limit: 2g
    pids_limit: 256
    ports:
      - "127.0.0.1:${CLINMESH_SYNTHEA_PROVIDER_PORT:-51878}:51878"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=1g,mode=1777
    user: ${CN_HEALTH_DATA_RUN_AS:-1000:1000}
    volumes:
      - ${CN_HEALTH_DATA_DIST:-../cn-health-data/dist}/synthea-cn-profile/releases/2026-08-29.r3:/opt/cn-health/synthea-profile:ro
