services:
  cn-health-localizer:
    cap_drop:
      - ALL
    cpus: "1.0"
    image: ghcr.io/caizongyuan/cn-health-synthea-localizer@sha256:8b716811d6912b4502168bd23e2cf5f8c25b2f7dcc64caae6706eb1b45262448
    init: true
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  synthea-provider:
    cap_drop:
      - ALL
    cpus: "2.0"
    depends_on:
      cn-health-localizer:
        condition: service_healthy
    image: ghcr.io/caizongyuan/clinmesh-synthea-provider@sha256:5ce7fe5f7223a21a31a58794a504fa94f058812d8815ee2448eb0592184910f8
    init: true
    mem_limit: 2g
    pids_limit: 256
    ports:
      - "127.0.0.1:${CLINMESH_SYNTHEA_PROVIDER_PORT:-51878}:51878"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    tmpfs:
      - /tmp:size=1g,mode=1777
